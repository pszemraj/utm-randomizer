<svg
  xmlns="http://www.w3.org/2000/svg"
  width="640"
  height="544"
  viewBox="0 0 640 544"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">One link, four ways to share it</title>
  <desc id="description">
    The destination https://example.com/article?id=42 stays intact in every mode. The copied link has
    utm_source=newsletter and utm_medium=email. Decoy uses plausible values such as outbrain and notification. Silly
    uses carrier-pigeon and shouting-really-loud. Hybrid mixes carrier-pigeon with notification. Remove deletes both
    tracking parameters. These are illustrative values; replacements vary by installation.
  </desc>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .heading {
      fill: #f0f6fc;
      font-size: 30px;
      font-weight: 650;
    }
    .label {
      fill: #f0f6fc;
      font-size: 24px;
      font-weight: 600;
    }
    .detail {
      fill: #adbdcc;
      font-size: 16px;
    }
    .key {
      fill: #adbdcc;
      font-size: 17px;
    }
    .value {
      font-size: 22px;
    }
    .mono {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
    }
  </style>
  <rect x="1" y="1" width="638" height="542" rx="18" fill="#0d141d" stroke="#2c3c4d" stroke-width="2" />
  <text x="24" y="44" class="heading">One link, four ways to share it.</text>

  <rect x="24" y="62" width="592" height="72" rx="10" fill="#152b23" stroke="#345c48" />
  <text x="42" y="90" fill="#86deb0" font-size="16" font-weight="600">KEPT IN EVERY MODE</text>
  <text x="42" y="119" fill="#e1f5e9" class="mono value">https://example.com/article?id=42</text>

  <rect x="24" y="150" width="592" height="56" rx="10" fill="#151f2b" stroke="#2c3c4d" />
  <text x="42" y="184" class="label">Copied</text>
  <text x="188" y="171" class="mono key">utm_source</text>
  <text x="308" y="171" fill="#f0f6fc" class="mono value">newsletter</text>
  <text x="188" y="197" class="mono key">utm_medium</text>
  <text x="308" y="197" fill="#f0f6fc" class="mono value">email</text>

  <path
    d="M 320 218 V 238 M 313 231 L 320 238 L 327 231"
    fill="none"
    stroke="#7f96ad"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <rect x="24" y="250" width="592" height="56" rx="10" fill="#151f2b" stroke="#2c3c4d" />
  <rect x="24" y="266" width="4" height="24" rx="2" fill="#9bc9ff" />
  <text x="42" y="284" class="label">Decoy</text>
  <text x="188" y="271" class="mono key">utm_source</text>
  <text x="308" y="271" fill="#9bc9ff" class="mono value">outbrain</text>
  <text x="188" y="297" class="mono key">utm_medium</text>
  <text x="308" y="297" fill="#9bc9ff" class="mono value">notification</text>

  <rect x="24" y="318" width="592" height="56" rx="10" fill="#151f2b" stroke="#2c3c4d" />
  <rect x="24" y="334" width="4" height="24" rx="2" fill="#f4cf80" />
  <text x="42" y="352" class="label">Silly</text>
  <text x="188" y="339" class="mono key">utm_source</text>
  <text x="308" y="339" fill="#f4cf80" class="mono value">carrier-pigeon</text>
  <text x="188" y="365" class="mono key">utm_medium</text>
  <text x="308" y="365" fill="#f4cf80" class="mono value">shouting-really-loud</text>

  <rect x="24" y="386" width="592" height="56" rx="10" fill="#151f2b" stroke="#2c3c4d" />
  <rect x="24" y="402" width="4" height="24" rx="2" fill="#d9b6fd" />
  <text x="42" y="420" class="label">Hybrid</text>
  <text x="188" y="407" class="mono key">utm_source</text>
  <text x="308" y="407" fill="#f4cf80" class="mono value">carrier-pigeon</text>
  <text x="188" y="433" class="mono key">utm_medium</text>
  <text x="308" y="433" fill="#9bc9ff" class="mono value">notification</text>

  <rect x="24" y="454" width="592" height="46" rx="10" fill="#152b23" stroke="#345c48" />
  <rect x="24" y="467" width="4" height="20" rx="2" fill="#86deb0" />
  <text x="42" y="485" class="label">Remove</text>
  <text x="188" y="485" fill="#86deb0" font-size="22">Tracking parameters removed</text>

  <text x="24" y="526" class="detail">Illustrative values. Replacements vary by installation.</text>
</svg>
